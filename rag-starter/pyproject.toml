[project]
name = "ribot"
version = "0.1.0"
description = "HMSTI 509 course-spine RAG chatbot (build it up week by week)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "chromadb>=0.5",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ribot"]
